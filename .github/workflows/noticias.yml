name: Atualizar noticias

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descarregar o calendario do Forex Factory
        run: |
          curl -fsSL -A "Mozilla/5.0" https://nfs.faireconomy.media/ff_calendar_thisweek.json -o novo.json
          python3 -c "import json; json.load(open('novo.json'))"
          mv novo.json noticias.json
      - name: Guardar no site
        run: |
          git config user.name "atualizador-noticias"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet || (git commit -m "Atualizar noticias" && git push)
