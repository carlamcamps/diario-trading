name: Notificacoes

# De 5 em 5 minutos: as noticias do dia as 5:50 (hora de Portugal), um aviso 30 min antes de cada noticia forte outro as 20:00 (falta 1 hora), o resumo do dia as 21:05 (so se for positivo) e o da semana as 22:00 de sexta.
# Precisa do segredo VAPID_PRIVATE (Settings > Secrets and variables > Actions).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Enviar uma notificacao de teste agora"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: notificacoes
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install --quiet pywebpush
      - name: Enviar notificacoes
        env:
          SB_URL: https://nexskfugwtmtwsexlhos.supabase.co/rest/v1
          SB_KEY: sb_publishable_-OiT0kTGfY4MmMgD28LrEg_9cQ6kMXW
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          TESTE: ${{ github.event_name == 'workflow_dispatch' && inputs.teste }}
        run: |
          python3 - <<'EOF'
          import json, os, base64, datetime, urllib.request, urllib.parse
          from zoneinfo import ZoneInfo
          from pywebpush import webpush, WebPushException
          from py_vapid import Vapid

          URL, KEY = os.environ['SB_URL'], os.environ['SB_KEY']
          PRIV = os.environ.get('VAPID_PRIVATE', '').strip()
          if not PRIV:
              print('Falta o segredo VAPID_PRIVATE: as notificacoes ainda nao estao ligadas.'); raise SystemExit(0)
          vapid = Vapid.from_raw(base64.urlsafe_b64decode(PRIV + '=' * (-len(PRIV) % 4)))
          SITE = 'https://carlamcamps.github.io/diario-trading/'
          from cryptography.hazmat.primitives import serialization
          _pub = vapid.public_key.public_bytes(serialization.Encoding.X962, serialization.PublicFormat.UncompressedPoint)
          PUBK = base64.urlsafe_b64encode(_pub).decode().rstrip('=')
          os.makedirs('notificacoes', exist_ok=True)
          open('notificacoes/chave-publica.txt', 'w').write(PUBK)   # the site reads this to sign up the phone with the matching key

          def sb(path, method='GET'):
              req = urllib.request.Request(URL + path, method=method, headers={'apikey': KEY, 'Authorization': 'Bearer ' + KEY})
              return urllib.request.urlopen(req, timeout=30).read()

          subs = json.loads(sb('/push_subs?select=endpoint,sub'))
          if not subs:
              print('Ainda nenhum telemovel ligou as notificacoes.')

          LIS = ZoneInfo('Europe/Lisbon')
          now = datetime.datetime.now(datetime.timezone.utc)
          loc = now.astimezone(LIS)
          today = loc.date()

          def when(e):
              return datetime.datetime.strptime(e['date'], '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.timezone.utc)

          ev = [e for e in json.load(open('noticias-arquivo.json')) if e.get('country') == 'USD']
          day = [e for e in ev if when(e).astimezone(LIS).date() == today]
          strong = [e for e in day if e.get('impact') == 'High']
          hol = [e for e in day if e.get('impact') == 'Holiday']

          slots = {}
          for e in strong:
              slots.setdefault(when(e).astimezone(LIS).strftime('%H:%M'), []).append(e)

          def short(group):
              names = [g['title'] for g in group]
              main = next((n for n in names if not n.startswith('Core')), names[0])
              return main + (' e mais ' + str(len(names) - 1) if len(names) > 1 else '')

          os.makedirs('notificacoes', exist_ok=True)
          try:
              sent = json.load(open('notificacoes/enviadas.json'))
          except Exception:
              sent = []
          msgs = []

          if os.environ.get('TESTE') == 'true':
              msgs.append(('teste-' + now.strftime('%Y%m%d%H%M%S'), {'title': 'Oi Carla 💛', 'body': 'As notificações do Diário estão a funcionar. Até já ✨', 'tag': 'teste'}))

          if loc.weekday() < 5:
              k = 'manha-' + today.isoformat()
              if k not in sent and (loc.hour, loc.minute) >= (5, 50) and loc.hour < 10:
                  if strong:
                      body = 'Hoje há notícias fortes: ' + ' · '.join(t + ' ' + short(g) for t, g in sorted(slots.items()))
                  else:
                      body = 'Hoje não há notícias fortes. Bom trading! ✨'
                  if hol:
                      body = 'Hoje é feriado nos EUA, o mercado costuma estar mais parado. ' + (body if strong else '')
                  msgs.append((k, {'title': 'Bom dia, Carla ☀️', 'body': body, 'tag': k}))
              k = 'fim-' + today.isoformat()
              if k not in sent and loc.hour == 20 and loc.minute < 45:
                  msgs.append((k, {'title': 'Oi Carla 💛', 'body': 'Falta 1 hora para terminar o dia de trading (21:00). Último esforço, com calma ✨', 'tag': k}))
              # the Diário of today / this week (TP = +2%, SL = -1%)
              NAMES = {'estrategia': 'Estratégia (Fusion)', 'conta': 'Fusion', 'prop_estrategia': 'Estratégia (Prop)', 'prop_conta': 'Prop'}
              def results(d1, d2):
                  rows = json.loads(sb('/dias?select=serie,dia,tp,sl,sem_operar&dia=gte.' + d1 + '&dia=lte.' + d2))
                  out = {}
                  for r in rows:
                      if r.get('sem_operar') or not ((r.get('tp') or 0) + (r.get('sl') or 0)): continue
                      o = out.setdefault(r['serie'], [0, 0, 0]); o[0] += r['tp'] or 0; o[1] += r['sl'] or 0; o[2] += (r['tp'] or 0) * 2 - (r['sl'] or 0)
                  return out
              def pct(v): return ('+' if v > 0 else '') + str(v) + '%'
              k = 'resumo-dia-' + today.isoformat()
              if k not in sent and loc.hour == 21 and 5 <= loc.minute < 50:
                  R = results(today.isoformat(), today.isoformat())
                  if R and sum(v[2] for v in R.values()) > 0:
                      body = ' · '.join(NAMES.get(s0, s0) + ' ' + str(v[0]) + ' TP / ' + str(v[1]) + ' SL ' + pct(v[2]) for s0, v in R.items())
                      msgs.append((k, {'title': 'Oi Carla 💛 Dia positivo ✨', 'body': 'Hoje: ' + body + '. Bom descanso 🌙', 'tag': k}))
                  else:
                      sent.append(k)   # negative or empty day: nothing is sent
              k = 'resumo-semana-' + today.isoformat()
              if k not in sent and loc.weekday() == 4 and loc.hour == 22 and loc.minute < 50:
                  mon = today - datetime.timedelta(days=4)
                  R = results(mon.isoformat(), today.isoformat())
                  if R:
                      body = ' · '.join(NAMES.get(s0, s0) + ' ' + pct(v[2]) for s0, v in R.items())
                      msgs.append((k, {'title': 'Oi Carla 💛 A tua semana', 'body': 'Esta semana: ' + body + '. Bom fim de semana ☀️', 'tag': k}))
                  else:
                      sent.append(k)
              for t, g in sorted(slots.items()):
                  k = 'aviso-' + today.isoformat() + '-' + t
                  mins = round((min(when(e) for e in g) - now).total_seconds() / 60)
                  if k not in sent and 1 <= mins <= 35:
                      body = 'Faltam ' + str(mins) + ' minutos para ' + short(g) + ' (' + t + '). Respira fundo e segue o plano 💛'
                      msgs.append((k, {'title': 'Oi Carla 💛', 'body': body, 'tag': k}))

          for k, m in msgs:
              m['url'] = SITE
              for s in subs:
                  try:
                      webpush(subscription_info=s['sub'], data=json.dumps(m, ensure_ascii=False), vapid_private_key=vapid, vapid_claims={'sub': 'mailto:diario-trading@users.noreply.github.com'}, ttl=3600, headers={'Urgency': 'high'})
                      print('enviado:', k)
                  except WebPushException as ex:
                      code = ex.response.status_code if ex.response is not None else None
                      print('falhou:', k, code, (ex.response.text if ex.response is not None else str(ex))[:300])
                      if code in (404, 410) or (code == 400 and 'VapidPkHashMismatch' in (ex.response.text if ex.response is not None else '')):
                          sb('/push_subs?endpoint=eq.' + urllib.parse.quote(s['endpoint'], safe=''), 'DELETE')
              if not k.startswith('teste'):
                  sent.append(k)

          json.dump(sent[-300:], open('notificacoes/enviadas.json', 'w'))
          EOF
      - name: Guardar o que ja foi enviado
        run: |
          git config user.name "notificacoes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notificacoes/enviadas.json notificacoes/chave-publica.txt
          git diff --cached --quiet || (git commit -m "Notificacoes enviadas" && (git push || (git pull --rebase && git push)))
