name: Notificacoes

# De 5 em 5 minutos: uma frase motivacional as 10:00 e as 17:00 (todos os dias), as noticias do dia as 5:50 (hora de Portugal), um aviso 30 min antes de cada noticia forte outro as 20:00 (falta 1 hora), o resumo do dia as 21:05 (so se for positivo) e o da semana as 22:00 de sexta.
# Precisa do segredo VAPID_PRIVATE (Settings > Secrets and variables > Actions).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Enviar uma notificacao de teste agora"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: notificacoes
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install --quiet pywebpush
      - name: Enviar notificacoes
        env:
          SB_URL: https://nexskfugwtmtwsexlhos.supabase.co/rest/v1
          SB_KEY: sb_publishable_-OiT0kTGfY4MmMgD28LrEg_9cQ6kMXW
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          TESTE: ${{ github.event_name == 'workflow_dispatch' && inputs.teste }}
        run: |
          python3 - <<'EOF'
          import json, os, base64, datetime, urllib.request, urllib.parse
          from zoneinfo import ZoneInfo
          from pywebpush import webpush, WebPushException
          from py_vapid import Vapid

          URL, KEY = os.environ['SB_URL'], os.environ['SB_KEY']
          PRIV = os.environ.get('VAPID_PRIVATE', '').strip()
          if not PRIV:
              print('Falta o segredo VAPID_PRIVATE: as notificacoes ainda nao estao ligadas.'); raise SystemExit(0)
          vapid = Vapid.from_raw(base64.urlsafe_b64decode(PRIV + '=' * (-len(PRIV) % 4)))
          SITE = 'https://carlamcamps.github.io/diario-trading/'
          from cryptography.hazmat.primitives import serialization
          _pub = vapid.public_key.public_bytes(serialization.Encoding.X962, serialization.PublicFormat.UncompressedPoint)
          PUBK = base64.urlsafe_b64encode(_pub).decode().rstrip('=')
          os.makedirs('notificacoes', exist_ok=True)
          open('notificacoes/chave-publica.txt', 'w').write(PUBK)   # the site reads this to sign up the phone with the matching key

          def sb(path, method='GET'):
              req = urllib.request.Request(URL + path, method=method, headers={'apikey': KEY, 'Authorization': 'Bearer ' + KEY})
              return urllib.request.urlopen(req, timeout=30).read()

          subs = json.loads(sb('/push_subs?select=endpoint,sub'))
          if not subs:
              print('Ainda nenhum telemovel ligou as notificacoes.')

          LIS = ZoneInfo('Europe/Lisbon')
          now = datetime.datetime.now(datetime.timezone.utc)
          loc = now.astimezone(LIS)
          today = loc.date()

          def when(e):
              return datetime.datetime.strptime(e['date'], '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.timezone.utc)

          ev = [e for e in json.load(open('noticias-arquivo.json')) if e.get('country') == 'USD']
          day = [e for e in ev if when(e).astimezone(LIS).date() == today]
          strong = [e for e in day if e.get('impact') == 'High']
          hol = [e for e in day if e.get('impact') == 'Holiday']

          slots = {}
          for e in strong:
              slots.setdefault(when(e).astimezone(LIS).strftime('%H:%M'), []).append(e)

          def short(group):
              names = [g['title'] for g in group]
              main = next((n for n in names if not n.startswith('Core')), names[0])
              return main + (' e mais ' + str(len(names) - 1) if len(names) > 1 else '')

          os.makedirs('notificacoes', exist_ok=True)
          try:
              sent = json.load(open('notificacoes/enviadas.json'))
          except Exception:
              sent = []
          msgs = []

          if os.environ.get('TESTE') == 'true':
              msgs.append(('teste-' + now.strftime('%Y%m%d%H%M%S'), {'title': 'Oi Carla 💛', 'body': 'As notificações do Diário estão a funcionar. Até já ✨', 'tag': 'teste'}))

          # every day at 10:00 and 17:00: a motivational sentence (a different one each time)
          FRASES = [
              'Disciplina hoje, liberdade amanhã.',
              'Não precisas de operar sempre. Precisas de operar bem.',
              'Um bom trade é o que segue o plano, ganhe ou perca.',
              'Paciência também é uma posição.',
              'O mercado vai estar cá amanhã. Protege o teu capital.',
              'Pequenos passos todos os dias fazem grandes resultados.',
              'Confia no processo, não no resultado de um dia.',
              'Calma, foco e plano. O resto vem.',
              'Um SL é só o preço de estar no jogo.',
              'Tu és mais forte do que qualquer dia vermelho.',
              'Menos emoção, mais execução.',
              'Espera pelo setup. Ele vem ter contigo.',
              'Cada dia é uma nova oportunidade de fazer bem.',
              'Os profissionais esperam. Os amadores perseguem.',
              'Hoje faz o teu melhor, e isso chega.',
              'Consistência vence intensidade.',
              'Respira fundo. Segue as tuas regras.',
              'O teu futuro agradece a disciplina de hoje.',
              'Não é sorte, é trabalho e paciência.',
              'Protege a tua mente como proteges a tua conta.',
              'Um passo de cada vez, uma operação de cada vez.',
              'Acredita em ti. Já chegaste tão longe.',
              'O plano é o teu melhor amigo no mercado.',
              'Ganhar devagar também é ganhar.',
              'Tu mereces o sucesso que estás a construir.',
              'Foco no que controlas: a tua entrada, o teu stop, a tua calma.',
              'Hoje é dia de fazer as coisas bem feitas.',
              'Grandes traders são feitos de dias normais bem feitos.',
              'Sê paciente contigo e com o mercado.',
              'Trust the process ✨',
              'O mercado recompensa quem sabe esperar.',
              'Hoje não tens de ganhar tudo. Tens de fazer bem.',
              'A tua calma é a tua maior vantagem.',
              'Segue o plano mesmo quando ninguém está a ver.',
              'Um dia mau não apaga um mês bom.',
              'Quem controla o risco, controla o jogo.',
              'Faz menos, mas faz melhor.',
              'O sucesso é a soma de pequenos dias bem feitos.',
              'A pressa é inimiga do lucro.',
              'Confia no trabalho que já fizeste.',
              'Cada operação é só uma entre muitas.',
              'Hoje escolhe a paciência.',
              'Tu não precisas de provar nada ao mercado.',
              'A disciplina é o caminho mais curto.',
              'Quando duvidares, fica de fora.',
              'Os melhores trades parecem aborrecidos.',
              'Protege o que ganhaste.',
              'O teu stop é a tua proteção, não o teu inimigo.',
              'Respeita as tuas regras como respeitas o teu dinheiro.',
              'A vitória está em seguir o processo.',
              'O mercado não te deve nada. Tu deves a ti a disciplina.',
              'Sorri: estás a construir algo grande.',
              'Um passo atrás também é estratégia.',
              'Hoje é um bom dia para ser paciente.',
              'Não persigas o preço. Deixa-o vir.',
              'Mente tranquila, mãos firmes.',
              'Ganhas quando segues o plano, não só quando dá lucro.',
              'Cada SL é uma lição, cada TP é uma confirmação.',
              'Acredita no teu backtesting.',
              'O tempo trabalha a favor de quem é consistente.',
              'Tu és capaz. Já o provaste muitas vezes.',
              'Faz do teu plano um hábito.',
              'O medo e a ganância não entram hoje.',
              'Mais vale perder uma oportunidade do que perder a calma.',
              'O mercado abre todos os dias. Não há pressa.',
              'Trabalha em silêncio, deixa os resultados falar.',
              'Bons hábitos criam bons resultados.',
              'O teu foco é o teu superpoder.',
              'Hoje cuida da tua conta como cuidas de ti.',
              'Não deixes um trade estragar o teu dia.',
              'A paciência paga sempre.',
              'Sê fiel às tuas regras.',
              'O lucro é consequência, a disciplina é a causa.',
              'Faz o trade que o plano pede, não o que a emoção quer.',
              'Hoje celebra o progresso, por mais pequeno que seja.',
              'Cada dia de disciplina conta.',
              'Não comparas o teu caminho com o de ninguém.',
              'A consistência é a tua assinatura.',
              'Respira. Observa. Executa.',
              'O melhor investimento és tu.',
              'Um mercado calmo pede uma trader calma.',
              'Não forces. Deixa acontecer.',
              'Tu estás exatamente onde precisas de estar.',
              'Planeia o trade, faz o trade que planeaste.',
              'A tua estratégia funciona. Dá-lhe tempo.',
              'Fica orgulhosa de cada dia em que seguiste as regras.',
              'Os dias difíceis fazem traders fortes.',
              'Hoje joga para não perder, e o ganho aparece.',
              'Menos ecrã, mais clareza.',
              'Grandes resultados pedem paciência.',
              'Confia em ti, tu sabes o que fazer.',
              'Quem espera pelo setup certo, colhe.',
              'O mercado ensina todos os dias. Continua a aprender.',
              'Fecha o dia com a consciência tranquila.',
              'A liberdade constrói-se trade a trade.',
              'Mantém o foco no longo prazo.',
              'Hoje faz o simples bem feito.',
              'A emoção passa, o plano fica.',
              'O teu eu do futuro está a torcer por ti.',
              'Um dia de cada vez. Sempre.',
              'Não há trade perfeito, há trade disciplinado.',
              'Cuida do risco e o lucro cuida de si.',
              'A tua força está na tua rotina.',
              'Hoje confia, executa e descansa.',
              'Pequenas vitórias também são vitórias.',
              'Ninguém ganha sempre. Os bons perdem pouco.',
              'Mantém a cabeça fria e o coração leve.',
              'O teu sonho está a ser construído hoje.',
              'Fazer nada também pode ser a melhor decisão.',
              'Sê a trader que o teu plano merece.',
              'Hoje é dia de brilhar com calma ✨',
              'O caminho é longo, mas estás no caminho certo.',
              'Não olhes para o saldo a cada minuto. Olha para o plano.',
              'Persistência transforma bons dias em bons anos.',
              'A tua disciplina inspira.',
              'Hoje escolhe qualidade em vez de quantidade.',
              'O mercado favorece os pacientes.',
              'Cada manhã é um novo começo.',
              'Faz o teu trabalho e deixa o mercado fazer o dele.',
              'Tu tens tudo o que precisas para ter sucesso.',
          ]
          for hh in (10, 17):
              k = 'frase-' + today.isoformat() + '-' + str(hh)
              if k not in sent and hh <= loc.hour < hh + 3:   # GitHub only runs about once an hour: send at the first run after the time
                  frase = FRASES[(today.toordinal() * 2 + (1 if hh == 17 else 0)) % len(FRASES)]
                  msgs.append((k, {'title': 'Oi Carla 💛' if hh == 10 else 'Força, Carla ✨', 'body': frase, 'tag': k}))

          if loc.weekday() < 5:
              k = 'manha-' + today.isoformat()
              if k not in sent and (loc.hour, loc.minute) >= (5, 50) and loc.hour < 10:
                  if strong:
                      body = 'Hoje há notícias fortes: ' + ' · '.join(t + ' ' + short(g) for t, g in sorted(slots.items()))
                  else:
                      body = 'Hoje não há notícias fortes. Bom trading! ✨'
                  if hol:
                      body = 'Hoje é feriado nos EUA, o mercado costuma estar mais parado. ' + (body if strong else '')
                  msgs.append((k, {'title': 'Bom dia, Carla ☀️', 'body': body, 'tag': k}))
              k = 'fim-' + today.isoformat()
              if k not in sent and loc.hour == 20:
                  msgs.append((k, {'title': 'Oi Carla 💛', 'body': 'Falta 1 hora para terminar o dia de trading (21:00). Último esforço, com calma ✨', 'tag': k}))
              # what she really traded: only the Fusion and Prop tables count (the Estratégias are backtesting). TP = +TPV%, SL = -1%
              NAMES = {'conta': 'Fusion', 'prop_conta': 'Prop'}
              # how much a TP is worth: set in the site (Configurações), kept in the row serie=config
              TPV = 2
              try:
                  cf = json.loads(sb('/dias?select=tp&serie=eq.config&limit=1'))
                  if cf and 1 <= int(cf[0]['tp'] or 0) <= 10: TPV = int(cf[0]['tp'])
              except Exception:
                  pass
              def results(d1, d2):
                  rows = json.loads(sb('/dias?select=serie,dia,tp,sl,sem_operar&dia=gte.' + d1 + '&dia=lte.' + d2))
                  out = {}
                  for r in rows:
                      if r['serie'] not in NAMES or r.get('sem_operar') or not ((r.get('tp') or 0) + (r.get('sl') or 0)): continue
                      o = out.setdefault(r['serie'], [0, 0, 0]); o[0] += r['tp'] or 0; o[1] += r['sl'] or 0; o[2] += (r['tp'] or 0) * TPV - (r['sl'] or 0)
                  return out
              def pct(v): return ('+' if v > 0 else '') + str(v) + '%'
              k = 'resumo-dia-' + today.isoformat()
              if k not in sent and (loc.hour, loc.minute) >= (21, 5) and loc.hour <= 23:
                  R = results(today.isoformat(), today.isoformat())
                  if R and sum(v[2] for v in R.values()) > 0:
                      body = ' e '.join('na ' + NAMES[s0] + ' foi ' + pct(v[2]) + ' (' + str(v[0]) + ' TP, ' + str(v[1]) + ' SL)' for s0, v in sorted(R.items()))
                      msgs.append((k, {'title': 'Oi Carla 💛 Dia positivo ✨', 'body': 'Hoje, ' + body + '. Bom descanso 🌙', 'tag': k}))
                  else:
                      sent.append(k)   # negative or empty day: nothing is sent
              k = 'resumo-semana-' + today.isoformat()
              if k not in sent and loc.weekday() == 4 and 22 <= loc.hour <= 23:
                  mon = today - datetime.timedelta(days=4)
                  R = results(mon.isoformat(), today.isoformat())
                  if R:
                      body = ' e '.join('na ' + NAMES[s0] + ' foi ' + pct(v[2]) for s0, v in sorted(R.items()))
                      msgs.append((k, {'title': 'Oi Carla 💛 A tua semana', 'body': 'Esta semana, ' + body + '. Bom fim de semana ☀️', 'tag': k}))
                  else:
                      sent.append(k)
              for t, g in sorted(slots.items()):
                  k = 'aviso-' + today.isoformat() + '-' + t
                  mins = round((min(when(e) for e in g) - now).total_seconds() / 60)
                  if k not in sent and 1 <= mins <= 90:
                      body = 'Faltam ' + str(mins) + ' minutos para ' + short(g) + ' (' + t + '). Respira fundo e segue o plano 💛'
                      msgs.append((k, {'title': 'Oi Carla 💛', 'body': body, 'tag': k}))

          for k, m in msgs:
              m['url'] = SITE
              for s in subs:
                  try:
                      webpush(subscription_info=s['sub'], data=json.dumps(m, ensure_ascii=False), vapid_private_key=vapid, vapid_claims={'sub': 'mailto:diario-trading@users.noreply.github.com'}, ttl=3600, headers={'Urgency': 'high'})
                      print('enviado:', k)
                  except WebPushException as ex:
                      code = ex.response.status_code if ex.response is not None else None
                      print('falhou:', k, code, (ex.response.text if ex.response is not None else str(ex))[:300])
                      if code in (404, 410) or (code == 400 and 'VapidPkHashMismatch' in (ex.response.text if ex.response is not None else '')):
                          sb('/push_subs?endpoint=eq.' + urllib.parse.quote(s['endpoint'], safe=''), 'DELETE')
              if not k.startswith('teste'):
                  sent.append(k)

          json.dump(sent[-300:], open('notificacoes/enviadas.json', 'w'))
          EOF
      - name: Guardar o que ja foi enviado
        run: |
          git config user.name "notificacoes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notificacoes/enviadas.json notificacoes/chave-publica.txt
          git diff --cached --quiet || (git commit -m "Notificacoes enviadas" && (git push || (git pull --rebase && git push)))
