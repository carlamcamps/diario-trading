name: Notificacoes

# De 5 em 5 minutos: uma frase motivacional as 10:00 e as 17:00 (todos os dias), as noticias do dia as 5:50 (hora de Portugal), um aviso 30 min antes de cada noticia forte outro as 20:00 (falta 1 hora), o resumo do dia as 21:05 (so se for positivo) e o da semana as 22:00 de sexta.
# Precisa do segredo VAPID_PRIVATE (Settings > Secrets and variables > Actions).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Enviar uma notificacao de teste agora"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: notificacoes
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install --quiet pywebpush
      - name: Enviar notificacoes
        env:
          SB_URL: https://nexskfugwtmtwsexlhos.supabase.co/rest/v1
          SB_KEY: sb_publishable_-OiT0kTGfY4MmMgD28LrEg_9cQ6kMXW
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          TESTE: ${{ github.event_name == 'workflow_dispatch' && inputs.teste }}
        run: |
          python3 - <<'EOF'
          import json, os, base64, datetime, urllib.request, urllib.parse
          from zoneinfo import ZoneInfo
          from pywebpush import webpush, WebPushException
          from py_vapid import Vapid

          URL, KEY = os.environ['SB_URL'], os.environ['SB_KEY']
          PRIV = os.environ.get('VAPID_PRIVATE', '').strip()
          if not PRIV:
              print('Falta o segredo VAPID_PRIVATE: as notificacoes ainda nao estao ligadas.'); raise SystemExit(0)
          vapid = Vapid.from_raw(base64.urlsafe_b64decode(PRIV + '=' * (-len(PRIV) % 4)))
          SITE = 'https://carlamcamps.github.io/diario-trading/'
          from cryptography.hazmat.primitives import serialization
          _pub = vapid.public_key.public_bytes(serialization.Encoding.X962, serialization.PublicFormat.UncompressedPoint)
          PUBK = base64.urlsafe_b64encode(_pub).decode().rstrip('=')
          os.makedirs('notificacoes', exist_ok=True)
          open('notificacoes/chave-publica.txt', 'w').write(PUBK)   # the site reads this to sign up the phone with the matching key

          def sb(path, method='GET'):
              req = urllib.request.Request(URL + path, method=method, headers={'apikey': KEY, 'Authorization': 'Bearer ' + KEY})
              return urllib.request.urlopen(req, timeout=30).read()

          subs = json.loads(sb('/push_subs?select=endpoint,sub'))
          if not subs:
              print('Ainda nenhum telemovel ligou as notificacoes.')

          LIS = ZoneInfo('Europe/Lisbon')
          now = datetime.datetime.now(datetime.timezone.utc)
          loc = now.astimezone(LIS)
          today = loc.date()

          def when(e):
              return datetime.datetime.strptime(e['date'], '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.timezone.utc)

          ev = [e for e in json.load(open('noticias-arquivo.json')) if e.get('country') == 'USD']
          day = [e for e in ev if when(e).astimezone(LIS).date() == today]
          strong = [e for e in day if e.get('impact') == 'High']
          hol = [e for e in day if e.get('impact') == 'Holiday']

          slots = {}
          for e in strong:
              slots.setdefault(when(e).astimezone(LIS).strftime('%H:%M'), []).append(e)

          def short(group):
              names = [g['title'] for g in group]
              main = next((n for n in names if not n.startswith('Core')), names[0])
              return main + (' e mais ' + str(len(names) - 1) if len(names) > 1 else '')

          os.makedirs('notificacoes', exist_ok=True)
          try:
              sent = json.load(open('notificacoes/enviadas.json'))
          except Exception:
              sent = []
          msgs = []

          if os.environ.get('TESTE') == 'true':
              msgs.append(('teste-' + now.strftime('%Y%m%d%H%M%S'), {'title': 'Oi Carla 💛', 'body': 'As notificações do Diário estão a funcionar. Até já ✨', 'tag': 'teste'}))

          # every day at 10:00 and 17:00: a motivational sentence about life (NOT trading advice), a different one each time
          FRASES = [
              'Tu és mais forte do que imaginas.',
              'Acredita em ti, mesmo nos dias em que é difícil.',
              'Cada dia é uma nova oportunidade de seres feliz.',
              'Os teus sonhos merecem a tua coragem.',
              'Sorri. Hoje pode ser um dia lindo.',
              'Tu és capaz de coisas incríveis.',
              'Não desistas. O melhor ainda está para vir.',
              'Pequenos passos também te levam longe.',
              'Tu mereces tudo o que estás a construir.',
              'A tua luz faz falta ao mundo.',
              'Sê gentil contigo hoje.',
              'O teu esforço de hoje é o teu orgulho de amanhã.',
              'Coragem não é não ter medo, é avançar mesmo assim.',
              'Tu já superaste tantas coisas. Vais superar esta também.',
              'Faz hoje algo de que o teu eu do futuro se orgulhe.',
              'És exatamente quem precisas de ser.',
              'A vida é bonita, e tu também.',
              'Respira fundo. Tu consegues.',
              'Acredita no caminho, mesmo quando não vês o fim.',
              'O sucesso começa quando acreditas que é possível.',
              'Hoje é um bom dia para recomeçar.',
              'O teu valor não depende de um dia mau.',
              'Brilha à tua maneira ✨',
              'Tudo o que precisas já está dentro de ti.',
              'Persiste. As grandes coisas levam tempo.',
              'Sonha alto e trabalha com o coração.',
              'És mais corajosa do que pensas.',
              'Cada passo conta, mesmo os pequeninos.',
              'Dá-te o carinho que dás aos outros.',
              'O impossível só demora um bocadinho mais.',
              'A tua história ainda está a ser escrita, e vai ser linda.',
              'Hoje escolhe a calma e a alegria.',
              'Não te compares. O teu caminho é só teu.',
              'A felicidade está nas pequenas coisas. Repara nelas hoje.',
              'Tu inspiras mais pessoas do que imaginas.',
              'Os dias difíceis também passam.',
              'Sê orgulhosa de quanto já cresceste.',
              'Faz da tua vida uma obra de arte.',
              'Onde há vontade, há caminho.',
              'Tu és suficiente, tal como és.',
              'O teu futuro é brilhante. Continua.',
              'A tua força silenciosa move montanhas.',
              'Agradece o dia de hoje. É um presente.',
              'O teu sorriso muda o dia de alguém.',
              'Vai com calma, mas vai sempre.',
              'Acredita que mereces coisas boas, porque mereces.',
              'Cada manhã é uma página em branco. Escreve algo bonito.',
              'És a heroína da tua própria história.',
              'Os teus sonhos são válidos. Vai atrás deles.',
              'Hoje sê a tua melhor amiga.',
              'Nada floresce de um dia para o outro. Tem paciência contigo.',
              'A coragem cresce quando a usas.',
              'Tu tens um coração enorme. Usa-o também contigo.',
              'A vida recompensa quem não desiste.',
              'Sê a energia que queres atrair.',
              'Às vezes o mais corajoso é descansar.',
              'O que é teu está a caminho.',
              'Tu transformas tudo o que tocas.',
              'Celebra as pequenas vitórias de hoje.',
              'O medo é só sinal de que estás a crescer.',
              'Tu és amada, mais do que sabes 💛',
              'Confia no tempo das coisas.',
              'Hoje vai correr bem. Acredita.',
              'Não há limites para quem acredita.',
              'A tua determinação é inspiradora.',
              'És feita de força, luz e ternura.',
              'Um dia de cada vez, sempre em frente.',
              'Vive com o coração leve.',
              'O melhor investimento que podes fazer é em ti.',
              'Quando tudo parecer difícil, lembra-te de quão longe já chegaste.',
              'Escolhe ser feliz, mesmo com pouco.',
              'Tu és um milagre a acontecer todos os dias.',
              'Faz o que te faz sentir viva.',
              'O universo está a conspirar a teu favor.',
              'Cuidar de ti não é egoísmo, é amor.',
              'A persistência transforma sonhos em realidade.',
              'Abre o coração ao que este dia te traz.',
              'A tua presença é um presente.',
              'Mesmo devagar, estás a avançar.',
              'Hoje sê grata por tudo o que já tens.',
              'Tu és a prova de que é possível.',
              'As estrelas precisam do escuro para brilhar ✨',
              'Nunca é tarde para seres quem querias ser.',
              'A beleza da vida está no caminho.',
              'O teu coração sabe o caminho. Ouve-o.',
              'Hoje faz algo só porque te faz feliz.',
              'És maior do que qualquer obstáculo.',
              'Planta hoje o que queres colher amanhã.',
              'A tua alegria é contagiante.',
              'Lembra-te: tu és o teu lar.',
              'Quem acredita sempre alcança.',
              'Deixa ir o que pesa. Fica com o que te faz bem.',
              'Tens tanto para dar ao mundo.',
              'O amor que dás volta sempre para ti.',
              'Hoje é dia de te orgulhares de ti.',
              'Cai, levanta, sorri e continua.',
              'A vida é curta demais para não seres feliz.',
              'As melhores coisas acontecem a quem não desiste.',
              'Tu és luz, mesmo nos dias cinzentos.',
              'Tens o poder de mudar o teu dia.',
              'Segue o teu coração, ele é sábio.',
              'Sê paciente contigo. Estás a florescer.',
              'Nada é impossível para quem tem coragem.',
              'Que hoje te traga paz e alegria.',
              'O teu esforço não passa despercebido.',
              'Abraça quem és. És maravilhosa.',
              'Cada desafio deixa-te mais forte.',
              'O teu brilho não depende da opinião de ninguém.',
              'Hoje permite-te ser feliz sem culpa.',
              'Os sonhos não têm prazo de validade.',
              'Mais um dia, mais uma oportunidade de brilhar.',
              'Tu és a razão do sorriso de muita gente.',
              'Acredita na magia dos recomeços.',
              'A gratidão transforma o que temos em suficiente.',
              'Tens tudo para conquistar o que quiseres.',
              'Hoje sê leve como o ar e firme como uma montanha.',
              'Vais longe, porque nunca paras.',
              'O amor-próprio é o começo de tudo.',
              'O melhor da vida ainda está à tua espera.',
              'Trust the process ✨',
          ]
          for hh in (10, 17):
              k = 'frase-' + today.isoformat() + '-' + str(hh)
              if k not in sent and hh <= loc.hour < hh + 3:   # GitHub only runs about once an hour: send at the first run after the time
                  frase = FRASES[(today.toordinal() * 2 + (1 if hh == 17 else 0)) % len(FRASES)]
                  msgs.append((k, {'title': 'Oi Carla 💛' if hh == 10 else 'Força, Carla ✨', 'body': frase, 'tag': k}))

          if loc.weekday() < 5:
              k = 'manha-' + today.isoformat()
              if k not in sent and (loc.hour, loc.minute) >= (5, 50) and loc.hour < 10:
                  if strong:
                      body = 'Hoje há notícias fortes: ' + ' · '.join(t + ' ' + short(g) for t, g in sorted(slots.items()))
                  else:
                      body = 'Hoje não há notícias fortes. Bom trading! ✨'
                  if hol:
                      body = 'Hoje é feriado nos EUA, o mercado costuma estar mais parado. ' + (body if strong else '')
                  msgs.append((k, {'title': 'Bom dia, Carla ☀️', 'body': body, 'tag': k}))
              k = 'fim-' + today.isoformat()
              if k not in sent and loc.hour == 20:
                  msgs.append((k, {'title': 'Oi Carla 💛', 'body': 'Falta 1 hora para terminar o dia de trading (21:00). Último esforço, com calma ✨', 'tag': k}))
              # what she really traded: only the Fusion and Prop tables count (the Estratégias are backtesting). TP = +TPV%, SL = -1%
              NAMES = {'conta': 'Fusion', 'prop_conta': 'Prop'}
              # how much a TP is worth: set in the site (Configurações), kept in the row serie=config
              # Fusion and Prop can have different values (tp = Fusion, nota JSON tpProp = Prop)
              TPV = {'conta': 2, 'prop_conta': 2}
              try:
                  cf = json.loads(sb('/dias?select=tp,nota&serie=eq.config&limit=1'))
                  if cf and 1 <= int(cf[0]['tp'] or 0) <= 10: TPV['conta'] = TPV['prop_conta'] = int(cf[0]['tp'])
                  try:
                      tpp = int(json.loads(cf[0].get('nota') or '{}').get('tpProp') or 0)
                      if 1 <= tpp <= 10: TPV['prop_conta'] = tpp
                  except Exception:
                      pass
              except Exception:
                  pass
              def results(d1, d2):
                  rows = json.loads(sb('/dias?select=serie,dia,tp,sl,sem_operar&dia=gte.' + d1 + '&dia=lte.' + d2))
                  out = {}
                  for r in rows:
                      if r['serie'] not in NAMES or r.get('sem_operar') or not ((r.get('tp') or 0) + (r.get('sl') or 0)): continue
                      o = out.setdefault(r['serie'], [0, 0, 0]); o[0] += r['tp'] or 0; o[1] += r['sl'] or 0; o[2] += (r['tp'] or 0) * TPV[r['serie']] - (r['sl'] or 0)
                  return out
              def pct(v): return ('+' if v > 0 else '') + str(v) + '%'
              # 21:00: "how much did the day make?" (only if Fusion/Prop were traded today and it was not answered yet in the site)
              k = 'fimdia-' + today.isoformat()
              if k not in sent and 21 <= loc.hour <= 22:
                  try:
                      rows = json.loads(sb('/dias?select=serie,tp,sl,comissoes&dia=eq.' + today.isoformat() + '&serie=in.(conta,prop_conta)'))
                  except Exception:
                      rows = []
                  traded = [r for r in rows if (r.get('tp') or 0) + (r.get('sl') or 0) > 0]
                  answered = all(any((c or {}).get('h') == 'fim' for c in (r.get('comissoes') or [])) for r in traded)
                  if traded and not answered:
                      msgs.append((k, {'title': 'Oi Carla 💛 Quanto deu o dia?', 'body': 'Diz-me quanto ganhaste ou perdeste hoje, para eu calcular a comissão ✨', 'tag': k}))
                  elif traded or loc.hour == 22:
                      sent.append(k)
              k = 'resumo-dia-' + today.isoformat()
              if k not in sent and (loc.hour, loc.minute) >= (21, 5) and loc.hour <= 23:
                  R = results(today.isoformat(), today.isoformat())
                  if R and sum(v[2] for v in R.values()) > 0:
                      body = ' e '.join('na ' + NAMES[s0] + ' foi ' + pct(v[2]) + ' (' + str(v[0]) + ' TP, ' + str(v[1]) + ' SL)' for s0, v in sorted(R.items()))
                      msgs.append((k, {'title': 'Oi Carla 💛 Dia positivo ✨', 'body': 'Hoje, ' + body + '. Bom descanso 🌙', 'tag': k}))
                  else:
                      sent.append(k)   # negative or empty day: nothing is sent
              k = 'resumo-semana-' + today.isoformat()
              if k not in sent and loc.weekday() == 4 and 22 <= loc.hour <= 23:
                  mon = today - datetime.timedelta(days=4)
                  R = results(mon.isoformat(), today.isoformat())
                  if R:
                      body = ' e '.join('na ' + NAMES[s0] + ' foi ' + pct(v[2]) for s0, v in sorted(R.items()))
                      msgs.append((k, {'title': 'Oi Carla 💛 A tua semana', 'body': 'Esta semana, ' + body + '. Bom fim de semana ☀️', 'tag': k}))
                  else:
                      sent.append(k)
              for t, g in sorted(slots.items()):
                  k = 'aviso-' + today.isoformat() + '-' + t
                  mins = round((min(when(e) for e in g) - now).total_seconds() / 60)
                  if k not in sent and 1 <= mins <= 90:
                      body = 'Faltam ' + str(mins) + ' minutos para ' + short(g) + ' (' + t + '). Respira fundo e segue o plano 💛'
                      msgs.append((k, {'title': 'Oi Carla 💛', 'body': body, 'tag': k}))

          for k, m in msgs:
              m['url'] = SITE
              for s in subs:
                  try:
                      webpush(subscription_info=s['sub'], data=json.dumps(m, ensure_ascii=False), vapid_private_key=vapid, vapid_claims={'sub': 'mailto:diario-trading@users.noreply.github.com'}, ttl=3600, headers={'Urgency': 'high'})
                      print('enviado:', k)
                  except WebPushException as ex:
                      code = ex.response.status_code if ex.response is not None else None
                      print('falhou:', k, code, (ex.response.text if ex.response is not None else str(ex))[:300])
                      if code in (404, 410) or (code == 400 and 'VapidPkHashMismatch' in (ex.response.text if ex.response is not None else '')):
                          sb('/push_subs?endpoint=eq.' + urllib.parse.quote(s['endpoint'], safe=''), 'DELETE')
              if not k.startswith('teste'):
                  sent.append(k)

          json.dump(sent[-300:], open('notificacoes/enviadas.json', 'w'))
          EOF
      - name: Guardar o que ja foi enviado
        run: |
          git config user.name "notificacoes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notificacoes/enviadas.json notificacoes/chave-publica.txt
          git diff --cached --quiet || (git commit -m "Notificacoes enviadas" && (git push || (git pull --rebase && git push)))
